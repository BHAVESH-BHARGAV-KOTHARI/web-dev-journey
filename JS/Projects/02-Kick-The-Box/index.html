<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick The Block</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div id="title">
        <h1>KICK THE</h1>
        <h1>BLOCK</h1>
    </div>

    <button id="startBtn">START GAME</button>

    <div id="score">
        <h2>Score: <span id="value">0</span></h2>
    </div>

    <div id="time">
        <h2>Time: <span id="timer">10</span></h2>
    </div>
</header>

<div id="block"></div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Join Adventurer</title>
  <link rel="stylesheet" href="style4.css">
</head>
<body>

  <div class="login-box">

    <img src="../assets/logo.png" id="logo">
    <h3>CREATE YOUR ACCOUNT</h3>

    <label for="name">NAME</label>
    <input type="text" id="name" class="in">

    <label for="email">EMAIL</label>
    <input type="text" id="email" class="in">

    <label for="pass">PASSWORD</label>
    <input type="password" id="pass" class="in">

    <label>CHOOSE YOUR EXPERIENCE</label>
    <select name="levels" id="levels" class="in">
      <option value="" disabled selected hidden>Choose your experience</option>
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Experienced">Experienced</option>
    </select>
    
    <div class="checkbox-row">
      <input type="checkbox" id="agree">
      <label for="agree">I agree to the <a href="#">Terms of Service.</a></label>
    </div>

    <button class="custom-btn">JOIN NOW</button>

  </div>
  
</body>
</html>
